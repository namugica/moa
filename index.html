<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142947">
  <meta name="description" content="Moa Space에서 동아리 지출과 공동 자금을 한곳에 관리하세요.">
  <title>Moa Space — 동아리 공동 지출 관리</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <div class="app-shell">
    <header class="app-header">
      <a href="#home" class="brand" aria-label="Moa Space 홈"><span class="brand-mark" aria-hidden="true">M</span>Moa Space</a>
      <div class="header-right"><span class="global-sync">동아리 지출을 한곳에서 관리해요</span><div id="auth-controls"></div></div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer><strong>Moa Space</strong><span>동아리 지출과 공동 자금을 한곳에서 관리해요.</span></footer>
  </div>
  <dialog id="editor" aria-labelledby="dialog-title">
    <form id="editor-form">
      <header class="dialog-header"><h2 id="dialog-title"></h2><button type="button" class="icon-button" data-close aria-label="닫기">✕</button></header>
      <div id="dialog-fields"></div><p class="form-error" id="form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" class="button secondary" data-close>취소</button><button class="button" type="submit">저장하기</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
