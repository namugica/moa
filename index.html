<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f5">
  <meta name="description" content="같이 쓴 돈은 모아, 각자 보낼 몫은 또렷하게.">
  <title>MOA — 모아장부</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <div class="app-shell">
    <header class="app-header">
      <a href="#home" class="brand" aria-label="MOA 홈">moa<span>●</span></a>
      <div class="header-right"><span class="global-sync">함께 쓴 돈을 모아요</span><div id="auth-controls"></div></div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer><strong>moa</strong><span>같이 쓴 돈은 모아, 각자 보낼 몫은 또렷하게.</span></footer>
  </div>
  <dialog id="editor" aria-labelledby="dialog-title">
    <form id="editor-form">
      <header class="dialog-header"><h2 id="dialog-title"></h2><button type="button" class="icon-button" data-close aria-label="닫기">✕</button></header>
      <div id="dialog-fields"></div><p class="form-error" id="form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" class="button secondary" data-close>취소</button><button class="button" type="submit">저장하기</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
